name: bergfex-browser-probe

on:
  workflow_dispatch:
  # Der Diagnose-Branch erlaubt den ersten Runner-Test, bevor dieser Workflow
  # auf main liegt. Kein schedule und keine Verbindung zum Pages-Deployment.
  push:
    branches: ["probe/bergfex-browser-*"]

permissions:
  contents: read

concurrency:
  group: bergfex-browser-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: scraper/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Bergfex in Chromium abrufen und mit Cheerio validieren
        # Reguläres Browserfenster unter Xvfb; kein Headless-User-Agent.
        run: xvfb-run --auto-servernum node tools/probe-bergfex-browser.js --headed
