name: scrape

on:
  # Minute 25: ORF aktualisiert erst ca. 10–20 Min nach :00 (ROADMAP #9).
  # Stündlicher Cron ist DST-unabhängig, da AT-Offset immer ganze Stunden.
  schedule:
    - cron: "25 * * * *"
  # Manuell auslösbar zum Testen, ohne auf die nächste Minute 25 zu warten.
  workflow_dispatch:

permissions:
  contents: write

# Nie zwei Läufe gleichzeitig (sonst Push-Konflikt auf data.json).
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - name: Install
        working-directory: scraper
        run: npm ci

      # Schreibt docs/data.json nur bei inhaltlicher Änderung (Zeitstempel zählen nicht).
      # Quellenfehler → Warnung im Lauf + Fehlerzustand in data.json, Lauf bleibt grün.
      - name: Scrape
        working-directory: scraper
        run: node index.js

      # git status statt git diff --quiet: erkennt auch eine noch nicht getrackte data.json.
      - name: Commit data.json (nur bei Änderung)
        run: |
          if [ -z "$(git status --porcelain -- docs/data.json)" ]; then
            echo "data.json unverändert – kein Commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git commit -m "data: Update $(TZ=Europe/Vienna date '+%Y-%m-%d %H:%M')"
          # Falls zwischenzeitlich jemand gepusht hat: rebasen statt scheitern.
          git push || { git pull --rebase && git push; }
