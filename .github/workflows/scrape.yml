name: scrape

on:
  # Minute 25: ORF aktualisiert erst ca. 10–20 Min nach :00 (ROADMAP #9).
  # Stündlicher Cron ist DST-unabhängig, da AT-Offset immer ganze Stunden.
  schedule:
    - cron: "25 * * * *"
  # Manuell auslösbar zum Testen, ohne auf die nächste Minute 25 zu warten.
  workflow_dispatch:

permissions:
  contents: write

# Nie zwei Läufe gleichzeitig (sonst Push-Konflikt auf data.json).
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - name: Install
        working-directory: scraper
        run: npm ci

      # Scrape-, Diff- und Commit-Schritte folgen in Phase 4.
