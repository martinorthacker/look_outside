name: scrape

on:
  # Minute 25: ORF aktualisiert erst ca. 10–20 Min nach :00 (ROADMAP #9).
  # :40/:55 sind Ersatz-Slots: GitHub verzögert schedule-Läufe und verwirft sie
  # bei Last (15./16.11.2026: 1 von 9 Läufen kam an). Job "check" sorgt dafür,
  # dass trotzdem nur einmal pro Stunde gescrapt wird.
  # Stündlicher Cron ist DST-unabhängig, da der AT-Offset immer ganze Stunden beträgt.
  schedule:
    - cron: "25,40,55 * * * *"
  # Manuell auslösbar zum Testen, ohne auf die nächste Minute 25 zu warten.
  workflow_dispatch:
  # Code-/Frontend-Änderungen sofort ausrollen statt erst beim nächsten Cron.
  push:
    branches: [main]
    paths: ["docs/**", "scraper/**", ".node-version", ".github/workflows/scrape.yml"]

permissions:
  contents: read
  pages: write      # Pages-Deploy
  id-token: write   # Pages-Deploy (OIDC)
  actions: write    # Selbst-Reaktivierung gegen 60-Tage-Inaktivität (ROADMAP #13)

# Nie zwei Deploys gleichzeitig; laufende Deploys nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Nur für schedule: Hat ein früherer Slot dieser Stunde schon nach dem ORF-Update
  # (Minute 20) gescrapt, entfällt dieser Lauf. Schont die Quellen (bergfex 429,
  # ROADMAP #7). push/workflow_dispatch laufen immer.
  check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      fresh: ${{ steps.age.outputs.fresh }}
    steps:
      - id: age
        run: |
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/data.json"
          gen=$(curl -fsS --retry 2 --max-time 20 "$url" | jq -r '.generatedAt // empty' || true)
          ts=$(date -d "$gen" +%s 2>/dev/null || echo 0)
          now=$(date +%s)
          # UTC-Stundenbeginn = AT-Stundenbeginn (ganzzahliger Offset, #9).
          due=$(( now - now % 3600 + 20 * 60 ))
          # Pages-CDN kann bis 600 s alt sein → im Zweifel wird gescrapt, nie übersprungen.
          if [ -n "$gen" ] && [ "$ts" -ge "$due" ]; then
            echo "data.json von $gen ist für diese Stunde aktuell → kein Scrape"
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "data.json von ${gen:-?} → Scrape fällig"
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          fi

  scrape-and-deploy:
    needs: check
    # check entfällt bei push/workflow_dispatch; schlägt check fehl, lieber scrapen.
    if: ${{ !cancelled() && needs.check.outputs.fresh != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # kein Push nötig (data.json wird nicht committet)

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - name: Install
        working-directory: scraper
        run: npm ci

      # Rote Tests → kein Deploy, die Live-Seite bleibt auf dem letzten Stand.
      - name: Test
        working-directory: scraper
        run: npm test

      # data.json ist nicht im Repo (ROADMAP #2). Der vorherige Stand kommt von der
      # Live-Seite und liefert bei Quellenausfall die letzten gültigen Daten.
      # Das Pages-CDN cacht bis zu 600 s und ignoriert Query-Parameter/no-cache
      # (getestet). Bei stündlichem Cron egal; nur bei Läufen < 10 Min hintereinander
      # kann der Fallback-Stand einen Lauf älter sein (lastSuccessAt stimmt trotzdem).
      - name: Vorherige data.json holen
        run: |
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/data.json"
          if curl -fsS --retry 2 --max-time 20 -o docs/data.json "$url"; then
            echo "vorherige data.json: $(wc -c < docs/data.json) Bytes"
          else
            rm -f docs/data.json
            echo "::notice title=data.json::Keine vorherige data.json (erster Deploy?) – kein Fallback bei Quellenausfall"
          fi

      - name: Scrape
        working-directory: scraper
        run: node index.js

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v5

      # Ohne Commits gibt es keine Repo-Aktivität; GitHub würde den Schedule nach
      # 60 Tagen deaktivieren. Erneutes Aktivieren per API setzt den Zähler zurück.
      # Nur nach >= 45 Tagen ohne Commit und ohne enable: Am 15./16.11.2026 kam nach
      # jedem enable-Aufruf stundenlang kein schedule-Lauf (13 Slots hintereinander).
      # enable setzt updated_at des Workflows, das dient als "zuletzt aktiviert".
      - name: Schedule aktiv halten
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wf="repos/${GITHUB_REPOSITORY}/actions/workflows/scrape.yml"
          commit=$(date -d "$(git log -1 --format=%cI)" +%s)
          enabled=$(date -d "$(gh api "$wf" --jq .updated_at)" +%s)
          last=$(( commit > enabled ? commit : enabled ))
          days=$(( ($(date +%s) - last) / 86400 ))
          if [ "$days" -ge 45 ]; then
            gh api -X PUT "$wf/enable"
            echo "::notice title=Schedule::$days Tage ohne Commit/enable → Workflow reaktiviert"
          else
            echo "Letzter Commit/enable vor $days Tagen → kein enable nötig"
          fi
